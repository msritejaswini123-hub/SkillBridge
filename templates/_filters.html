{# Shared filter bar for the recommendations and internships pages. #}
<form method="get" class="panel" id="filter-form">
  <div class="panel-body-tight">
    <div class="filters">
      <div class="field">
        <label for="q">Search</label>
        <input type="text" id="q" name="q" value="{{ filters.q }}" placeholder="Title, company or keyword">
      </div>
      <div class="field">
        <label for="location">Location</label>
        <select id="location" name="location">
          <option value="">Any</option>
          {% for location in options.locations %}
            <option value="{{ location }}" {{ 'selected' if filters.location == location }}>{{ location }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="domain">Domain</label>
        <select id="domain" name="domain">
          <option value="">All</option>
          {% for domain in options.domains %}
            <option value="{{ domain }}" {{ 'selected' if filters.domain == domain }}>{{ domain }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="skill">Skill</label>
        <select id="skill" name="skill">
          <option value="">Any</option>
          {% for skill in options.skills %}
            <option value="{{ skill }}" {{ 'selected' if filters.skill == skill }}>{{ skill }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="min_stipend">Min stipend</label>
        <select id="min_stipend" name="min_stipend">
          <option value="">Any</option>
          {% for amount in [5000, 10000, 15000, 20000, 25000] %}
            <option value="{{ amount }}" {{ 'selected' if filters.min_stipend == amount }}>{{ amount|rupees }}+</option>
          {% endfor %}
        </select>
      </div>
      <div class="btns">
        <button class="btn btn-primary" type="submit">Filter</button>
        <a class="btn btn-quiet" href="{{ request.path }}">Reset</a>
      </div>
    </div>
  </div>
</form>
